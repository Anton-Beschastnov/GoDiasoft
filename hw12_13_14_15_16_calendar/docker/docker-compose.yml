services:
  kafka:
    image: 'docker.io/bitnamilegacy/kafka:3.8.0'
    container_name: kafkabuild
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - app

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9090
    depends_on:
      - kafka
    networks:
      - app

  postgres:
    container_name: postgresbuild
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: "calendar"
      POSTGRES_USER: "calendar"
      POSTGRES_PASSWORD: "calendar"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - pg_data_new:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app


networks:
  app:
    driver: bridge

volumes:
  pg_data_new:
