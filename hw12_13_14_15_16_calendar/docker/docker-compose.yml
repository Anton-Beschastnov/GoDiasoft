services:
  kafka:
    image: 'docker.io/bitnamilegacy/kafka:4.0.0-debian-12-r10'
    container_name: kafkabuild
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=NkYjFusjSuWA2E5FhAC9Pg
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # Listeners
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9090,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - E:/Work/IdeaProjects/Kafka/server-2/kraft-combined-logs:/bitnami/kafka
    networks:
      - app


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9090
    depends_on:
      - kafka
    networks:
      - app

  postgres:
    container_name: postgrescalendar
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: "calendar"
      POSTGRES_USER: "calendar"
      POSTGRES_PASSWORD: "calendar"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - pg_data_calendar:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app


networks:
  app:
    driver: bridge

volumes:
  pg_data_calendar:
